[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synthehr"
dynamic = ["version"]
description = "Synthetic tabular health data with measured realism, formal privacy and auditable release evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Belhassen Ouerghi" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "xgboost>=2.0",
]
keywords = ["synthetic data", "differential privacy", "diffusion models",
            "GAN", "electronic health records", "privacy", "fairness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
synthehr = "synthehr.cli:main"

[project.urls]
Homepage = "https://github.com/BelhassenOuerghi/synthehr"
Changelog = "https://github.com/BelhassenOuerghi/synthehr/blob/HEAD/CHANGELOG.md"
Research = "https://github.com/BelhassenOuerghi/synthehr/tree/HEAD/research"

[tool.setuptools.dynamic]
version = { attr = "synthehr._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
