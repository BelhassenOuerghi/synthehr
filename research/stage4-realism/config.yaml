# =============================================================
# Configuration: Pillar 4 (realism) of the synthetic-EHR programme
# =============================================================
# Paths are relative to this repository and can be overridden with
#   SYNTHEHR_REPOS_ROOT  (folder holding the foundations' derived data)
#   SYNTHEHR_SYNTH_ROOT  (folder where synthetic datasets are written; never this repo)

# Monorepo layout: real-data inputs come from research/foundations/<task>/
# (built there from MIMIC-IV, never committed); synthetic datasets are
# written to ../synthehr-output/ NEXT TO the repository, never inside it.

repos_root: ../foundations
synthetic_root: ../../../synthehr-output/MIMIC-SyntheticPrivacyBiasEthicRealism
los_features:      length-of-stay/data/derived/features.parquet
los_cohort:        length-of-stay/data/derived/cohort.parquet
los_splits:        length-of-stay/data/derived/splits.parquet
readmission_frame: readmission/data/processed/feature_frame.parquet
beddemand_series:  bed-demand/data/derived/admissions_daily.csv

# Same seeds and split as the evidence repository, so every comparison with
# Stages 0-2 is paired on an identical patient-disjoint split.
seeds: [42, 43, 44, 45, 46]
test_size: 0.20

dp:
  primary_epsilon: 10.0
  delta: 1.0e-5
  clip_norm: 1.0
  hist_noise_multiplier: 32.0

fairness:
  sensitive:
    los: [gender]
    readmission: [gender, insurance]
  min_support: 0.02

mia:
  n_candidates: 8000

# The frozen CTGAN harness, unchanged from Stages 0-2.
ctgan:
  embedding_dim: 128
  generator_dim: [256, 256]
  discriminator_dim: [256, 256]
  batch_size: 500
  pac: 10
  gp_lambda: 10.0
  vgm_components: 10
  max_train_rows: 30000
  d_steps: 1
  epochs_stage0: 200
  epochs_dp: 100

# Pillar 4 generator. Values below are fixed by src/pilot.py (seed 42, training
# rows only, patient-disjoint validation) and then frozen for the main run.
tabddpm:
  hidden: [256, 256, 256]
  emb: 128
  timesteps: 1000
  batch_size: 4096
  steps: 20000            # non-private; pilot: best mean rank on both tasks
  lr: 1.0e-3
  dp_lr: 2.0e-3
  dp_expected_batch: 2048 # pilot: best mean rank on both tasks
  dp_epochs: 200
  noise_multiplicity: 4
  dp_chunk: 512           # rows per per-example-gradient chunk (memory only)
  capacity:               # the ordering (non-commutativity) arm
    S: [128, 128]
    M: [256, 256, 256]
    L: [512, 512, 512, 512]

ensemble:
  k: 4                    # generators pooled per release

beddemand:
  ar_window: 1
  test_days: 364
